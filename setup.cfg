[mutmut]
source_paths = apps/tenants/
also_copy =
    apps/__init__.py
    apps/accounts/
    apps/audit/
    apps/billing/
    apps/core/
    apps/projects/
    config/
    conftest.py
    pytest.ini
    manage.py
do_not_mutate =
    apps/tenants/migrations/*
    apps/tenants/tests/*
pytest_add_cli_args =
    --reuse-db
    -p
    no:cacheprovider
pytest_add_cli_args_test_selection =
    apps/
    config/
