      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/projects/export/:
    get:
      operationId: projects_export_retrieve
      description: Download the organization's projects as CSV (Pro plan only).
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      tags:
      - projects
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
          description: ''
  /api/subscription/:
    get:
      operationId: subscription_retrieve
      description: |-
        The active organization's plan (mock billing, no payment provider).

        Every member can view it; only owners change it. Downgrading is allowed
        even when the org is over the new plan's limits: nothing is deleted, but
        adding projects or members is blocked until usage is back under the limit.
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      tags:
      - subscription
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
    patch:
      operationId: subscription_partial_update
      description: |-
        The active organization's plan (mock billing, no payment provider).

        Every member can view it; only owners change it. Downgrading is allowed
        even when the org is over the new plan's limits: nothing is deleted, but
        adding projects or members is blocked until usage is back under the limit.
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      tags:
      - subscription
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChangePlanRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChangePlanRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChangePlanRequest'
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: ''
components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - token
    AcceptInvitationResponse:
      type: object
      properties:
        organization:
          type: object
          additionalProperties: {}
        role:
          type: string
      required:
      - organization
      - role
    AuditLogEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        actor_email:
          type: string
          format: email
          readOnly: true
        target_type:
          type: string
          readOnly: true
        target_id:
          type: string
          readOnly: true
        target_repr:
          type: string
          readOnly: true
        changes:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_email
      - changes
      - created_at
      - id
      - target_id
      - target_repr
      - target_type
    Invitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
        status:
          type: string
          readOnly: true
        invited_by:
          type: string
          format: email
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - accepted_at
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - status
    InvitationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - email
    Me:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        organizations:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
      required:
      - email
      - id
      - organizations
    Member:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/MemberUser'
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - user
    MemberUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
    OverLimit:
      type: object
      properties:
        members:
          type: boolean
        projects:
          type: boolean
      required:
      - members
      - projects
    PaginatedAuditLogEntryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
    PaginatedInvitationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
    PaginatedMemberList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    PaginatedProjectList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    PatchedChangePlanRequest:
      type: object
      properties:
        plan:
          $ref: '#/components/schemas/PlanEnum'
    PatchedMemberRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/RoleEnum'
    PatchedProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
    PlanEnum:
      enum:
      - free
      - pro
      type: string
      description: |-
        * `free` - Free
        * `pro` - Pro
    PlanLimits:
      type: object
      properties:
        max_members:
          type: integer
          nullable: true
        max_projects:
          type: integer
          nullable: true
        features:
          type: array
          items:
            type: string
      required:
      - features
      - max_members
      - max_projects
    Project:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        organization:
          type: string
          readOnly: true
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - name
      - organization
      - updated_at
    ProjectRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
      required:
      - name
    RoleEnum:
      enum:
      - owner
      - admin
      - member
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Admin
        * `member` - Member
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        organization_name:
          type: string
          minLength: 1
          maxLength: 255
        organization_slug:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - email
      - organization_name
      - password
    SignupResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/Me'
      required:
      - user
    Subscription:
      type: object
      properties:
        plan:
          $ref: '#/components/schemas/PlanEnum'
        limits:
          allOf:
          - $ref: '#/components/schemas/PlanLimits'
          readOnly: true
        usage:
          allOf:
          - $ref: '#/components/schemas/Usage'
          readOnly: true
        over_limit:
          allOf:
          - $ref: '#/components/schemas/OverLimit'
          readOnly: true
        warnings:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - limits
      - over_limit
      - plan
      - usage
      - warnings
    Usage:
      type: object
      properties:
        members:
          type: integer
        pending_invitations:
          type: integer
        projects:
          type: integer
      required:
      - members
      - pending_invitations
      - projects
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
