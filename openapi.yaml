openapi: 3.0.3
info:
  title: SaaS Tenant Starter API
  version: 2.0.0
  description: 'Multi-tenant API. Tenant-scoped endpoints need authentication plus
    an `X-Org: <organization-slug>` header.'
paths:
  /api/audit-log/:
    get:
      operationId: audit_log_list
      description: |-
        The active organization's audit log, newest first (admins and owners).

        Filter with `?action=project.update`.
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - audit-log
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogEntryList'
          description: ''
  /api/auth/signup/:
    post:
      operationId: auth_signup_create
      description: Create a user plus their first organization, with them as owner.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResponse'
          description: ''
  /api/invitations/:
    get:
      operationId: invitations_list
      description: |-
        Invitations to the active organization (admins and owners).

        Only owners can invite someone as owner. DELETE revokes the invitation.
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - invitations
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvitationList'
          description: ''
    post:
      operationId: invitations_create
      description: |-
        Invitations to the active organization (admins and owners).

        Only owners can invite someone as owner. DELETE revokes the invitation.
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InvitationRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/invitations/{id}/:
    get:
      operationId: invitations_retrieve
      description: |-
        Invitations to the active organization (admins and owners).

        Only owners can invite someone as owner. DELETE revokes the invitation.
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this invitation.
        required: true
      tags:
      - invitations
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
    delete:
      operationId: invitations_destroy
      description: |-
        Invitations to the active organization (admins and owners).

        Only owners can invite someone as owner. DELETE revokes the invitation.
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this invitation.
        required: true
      tags:
      - invitations
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/invitations/accept/:
    post:
      operationId: invitations_accept_create
      description: |-
        Accept an invitation with the token from the email.

        New users send a password to create their account; existing users
        authenticate (Basic or session) and send only the token.
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResponse'
          description: ''
  /api/me/:
    get:
      operationId: me_retrieve
      description: |-
        The current user and every organization they belong to.

        Clients switch between organizations by sending a different X-Org
        header; this lists the valid values.
      tags:
      - me
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/members/:
    get:
      operationId: members_list
      description: |-
        Members of the active organization.

        - Everyone can list members.
        - Only owners change roles (PATCH {"role": ...}).
        - Owners remove anyone; admins remove plain members; anyone can leave
          (DELETE their own membership).
        - The last owner can be neither demoted nor removed (409).
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - members
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMemberList'
          description: ''
  /api/members/{id}/:
    get:
      operationId: members_retrieve
      description: |-
        Members of the active organization.

        - Everyone can list members.
        - Only owners change roles (PATCH {"role": ...}).
        - Owners remove anyone; admins remove plain members; anyone can leave
          (DELETE their own membership).
        - The last owner can be neither demoted nor removed (409).
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this membership.
        required: true
      tags:
      - members
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
    patch:
      operationId: members_partial_update
      description: |-
        Members of the active organization.

        - Everyone can list members.
        - Only owners change roles (PATCH {"role": ...}).
        - Owners remove anyone; admins remove plain members; anyone can leave
          (DELETE their own membership).
        - The last owner can be neither demoted nor removed (409).
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this membership.
        required: true
      tags:
      - members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMemberRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMemberRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMemberRequest'
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
    delete:
      operationId: members_destroy
      description: |-
        Members of the active organization.

        - Everyone can list members.
        - Only owners change roles (PATCH {"role": ...}).
        - Owners remove anyone; admins remove plain members; anyone can leave
          (DELETE their own membership).
        - The last owner can be neither demoted nor removed (409).
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this membership.
        required: true
      tags:
      - members
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/projects/:
    get:
      operationId: projects_list
      description: |-
        Resolves the active organization for a DRF view from the X-Org header.

        Every tenant-scoped view must use this mixin. It runs after DRF
        authentication and before the view's permission classes, so it sees the
        real user whatever the auth method (Basic, session, ...):

          - unauthenticated              -> 401 with a WWW-Authenticate challenge
          - missing X-Org header         -> 400
          - unknown slug or non-member   -> 403, byte-identical in both cases

        On success it sets `request.tenant` and `request.membership` and
        activates the tenant context for the rest of the request, resetting it
        when the request finishes, even if the view raised.
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - projects
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
    post:
      operationId: projects_create
      description: |-
        Resolves the active organization for a DRF view from the X-Org header.

        Every tenant-scoped view must use this mixin. It runs after DRF
        authentication and before the view's permission classes, so it sees the
        real user whatever the auth method (Basic, session, ...):

          - unauthenticated              -> 401 with a WWW-Authenticate challenge
          - missing X-Org header         -> 400
          - unknown slug or non-member   -> 403, byte-identical in both cases

        On success it sets `request.tenant` and `request.membership` and
        activates the tenant context for the rest of the request, resetting it
        when the request finishes, even if the view raised.
      parameters:
      - in: header
        name: X-Org
        schema:
          type: string
        description: Slug of the organization (tenant) to act in.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
      security:
      - basicAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
